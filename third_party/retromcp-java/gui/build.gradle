plugins {
	alias libs.plugins.shadow
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

dependencies {
	implementation rootProject

	implementation libs.flatlaf
}

application {
	mainClass = "org.mcphackers.mcp.main.MainGUI"
	executableDir = "test"
	mkdir(executableDir)
}

run {
	workingDir "test"
}

runShadow {
	workingDir "test"
}

tasks.named("shadowJar", ShadowJar) {
	configurations = [project.configurations.compileClasspath]
	archiveBaseName.set("RetroMCP-GUI")
	archiveClassifier.set("all")
	setDestinationDirectory(rootProject.getLayout().getBuildDirectory().dir("libs"))
	minimize() {
		exclude(dependency(libs.flatlaf.get()))
		// Vineflower loads its plugins (Kotlin, pass builders) reflectively via its own
		// InJarClassLoader, so minimize() can't see them as "used" -- exclude it or those
		// classes get stripped and decompile crashes with NoClassDefFoundError at startup.
		exclude(dependency(libs.fernflower.get()))
	}
}
