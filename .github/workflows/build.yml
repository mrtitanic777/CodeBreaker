# Build CodeBreaker with every compiler it supports and run its unit tests, on every push and pull request.
# MSVC builds everything (the engines too) and runs the unit tests against them; Clang (clang-cl) and GCC (MinGW-w64)
# build the program and its tests and run the tests (a test whose engine or input is not there skips itself).
# The command cases and the milestone regression need the period toolchains and the original binaries
# (docs/NOT_IN_REPO.md), so they stay on the developer's machine (tools\gate.cmd, codebreaker regress).
name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # (a run on master finishes, so that frequent pushes cannot keep every compiler from ever reporting; the newest waiting push runs next)
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msvc:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # the Java lane's front end reads JDK 21's trees
        with:
          distribution: temurin
          java-version: '21'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: The one build (tools/build_native.cmd)
        shell: cmd
        run: tools\build_native.cmd
      - name: codebreaker.exe and the unit tests
        shell: cmd
        run: |
          cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl || exit /b 1
          cmake --build build --target codebreaker cb_tests -j 4 || exit /b 1
      - name: Unit tests
        shell: cmd
        run: build\cb_tests.exe

  clang:
    runs-on: windows-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # the Java lane's front end reads JDK 21's trees
        with:
          distribution: temurin
          java-version: '21'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # (the runner's Visual Studio STL needs a newer Clang than the clang-cl it ships, whose <format> does not compile against it)
      - name: A current clang-cl
        shell: cmd
        run: choco upgrade llvm --version=22.1.8 -y --no-progress --allow-downgrade
      - name: codebreaker.exe and the unit tests (clang-cl)
        shell: cmd
        run: |
          cmake -S src -B build-clang -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_C_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe" "-DCMAKE_CXX_COMPILER=C:/Program Files/LLVM/bin/clang-cl.exe" || exit /b 1
          cmake --build build-clang --target codebreaker cb_tests -j 4 || exit /b 1
      - name: Unit tests
        shell: cmd
        run: build-clang\cb_tests.exe

  gcc:
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4   # the Java lane's front end reads JDK 21's trees
        with:
          distribution: temurin
          java-version: '21'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit   # (Windows' PATH too: the JDK, and the Windows tools the tests start)
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: codebreaker.exe and the unit tests (GCC, MinGW-w64)
        run: |
          cmake -S src -B build-gcc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          cmake --build build-gcc --target codebreaker cb_tests -j 4
      - name: Unit tests
        run: ./build-gcc/cb_tests.exe
