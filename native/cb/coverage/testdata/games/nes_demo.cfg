MEMORY {
    HEADER: start = $0000, size = $0010, fill = yes, file = %O;
    PRG: start = $C000, size = $3FFA, fill = yes, file = %O;
    VEC: start = $FFFA, size = $0006, fill = yes, file = %O;
    CHR: start = $0000, size = $2000, fill = yes, file = %O;
}
SEGMENTS {
    HEADER: load = HEADER, type = ro;
    BANK0: load = PRG, type = ro;
    VECTORS: load = VEC, type = ro;
    CHARS: load = CHR, type = ro;
}
