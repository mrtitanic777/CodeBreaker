<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeBreaker Console</title>
<style>
  :root{
    --bg:#0e1117; --panel:#151b24; --panel2:#1b232e; --edge:#26303c;
    --ink:#e6edf3; --dim:#8b98a8; --faint:#5b6673;
    --amber:#e0a44c; --amber2:#f2c179; --cyan:#5cc8d8; --good:#5bd6a0; --bad:#e5646b;
    --mono:"Cascadia Code",ui-monospace,"SF Mono",Consolas,"Liberation Mono",monospace;
    --ui:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);
       display:grid;grid-template-columns:236px 1fr;grid-template-rows:100vh}
  /* sidebar */
  aside{background:var(--panel);border-right:1px solid var(--edge);padding:18px 0;overflow:auto}
  .brand{padding:0 20px 16px;border-bottom:1px solid var(--edge);margin-bottom:10px}
  .brand h1{margin:0;font:700 17px/1 var(--ui);letter-spacing:.14em}
  .brand h1 b{color:var(--amber)}
  .brand p{margin:6px 0 0;color:var(--faint);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
  nav a{display:flex;gap:10px;align-items:center;padding:9px 20px;color:var(--dim);
        cursor:pointer;border-left:3px solid transparent;font-size:13.5px}
  nav a:hover{color:var(--ink);background:var(--panel2)}
  nav a.on{color:var(--amber2);border-left-color:var(--amber);background:var(--panel2)}
  nav a .k{width:1.3em;text-align:center;color:var(--faint);font:12px var(--mono)}
  nav a.on .k{color:var(--amber)}
  .health{display:flex;gap:8px;align-items:center;padding:14px 20px 0;color:var(--faint);font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .dot.up{background:var(--good);box-shadow:0 0 8px var(--good)}
  /* main */
  main{overflow:auto;padding:26px 30px;display:flex;flex-direction:column;gap:16px;min-width:0}
  .head h2{margin:0;font-size:19px;font-weight:650}
  .head h2 span{color:var(--amber)}
  .head p{margin:5px 0 0;color:var(--dim);max-width:60ch}
  .form{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:16px;
        display:flex;flex-wrap:wrap;gap:12px;align-items:end}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:180px}
  .field label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  input,select{background:var(--bg);border:1px solid var(--edge);color:var(--ink);
        border-radius:7px;padding:9px 11px;font:13px var(--mono)}
  input:focus,select:focus{outline:none;border-color:var(--amber)}
  button{background:var(--amber);color:#1a1206;border:0;border-radius:7px;padding:10px 18px;
        font:600 13px var(--ui);cursor:pointer;letter-spacing:.02em}
  button:hover{background:var(--amber2)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--edge)}
  button.ghost:hover{color:var(--ink);border-color:var(--amber)}
  .status{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--dim);min-height:20px}
  .badge{font:12px var(--mono);padding:2px 8px;border-radius:5px;border:1px solid var(--edge)}
  .badge.ok{color:var(--good);border-color:#254c3c}
  .badge.err{color:var(--bad);border-color:#4c2528}
  .out{flex:1;min-height:220px;background:#0a0d12;border:1px solid var(--edge);border-radius:10px;
       padding:14px 16px;overflow:auto;font:12.5px/1.55 var(--mono);white-space:pre;color:#cdd6e0;tab-size:4}
  .out .cmt{color:var(--faint)} .out .kw{color:var(--cyan)} .out .name{color:var(--amber2)}
  .hint{color:var(--faint);font-size:11.5px;font-family:var(--mono)}
  a.link{color:var(--cyan);text-decoration:none} a.link:hover{text-decoration:underline}
  /* PE Explorer views */
  .out .petabs,.out .pebody,.out .hexctl{white-space:normal}
  .petabs{display:flex;gap:2px;flex-wrap:wrap;margin:-4px -4px 12px;position:sticky;top:-14px;background:#0a0d12;padding:8px 0}
  .petabs span{padding:5px 12px;cursor:pointer;color:var(--dim);border:1px solid var(--edge);border-radius:6px;font:12px var(--mono)}
  .petabs span:hover{color:var(--ink)} .petabs span.on{color:var(--amber2);border-color:var(--amber);background:var(--panel2)}
  .pebody h2{font-size:15px;color:var(--amber);margin:18px 0 6px} .pebody h3{font-size:13px;color:var(--amber2);margin:14px 0 4px}
  .pebody p{color:var(--dim);margin:4px 0}
  table.petbl{border-collapse:collapse;width:100%;margin:4px 0 10px;font:12px var(--mono)}
  table.petbl th{color:var(--faint);text-align:left;font-weight:600;border-bottom:1px solid var(--edge);padding:3px 10px 3px 0}
  table.petbl td{padding:2px 10px 2px 0;border-bottom:1px solid #1a2028;color:#cdd6e0;vertical-align:top}
  table.petbl tr:hover td{background:#12171e}
  .hexctl{display:flex;gap:12px;align-items:center;margin-bottom:8px;color:var(--dim);font:12px var(--mono)}
  pre.hexdump{margin:0;font:12px/1.5 var(--mono);color:#cdd6e0;white-space:pre}
  .respreview{margin-top:14px;border:1px solid var(--edge);border-radius:8px;background:#0e131a;min-height:0}
  .respreview:empty{display:none}
  .pvhdr{padding:8px 12px;border-bottom:1px solid var(--edge);color:var(--amber2);font:12px var(--mono)}
  .pvbody{padding:12px;overflow:auto}
  .pvimg{image-rendering:pixelated;max-width:100%;background:repeating-conic-gradient(#333 0 25%,#222 0 50%) 0/16px 16px;border:1px solid var(--edge)}
  pre.pvtext{margin:0;white-space:pre-wrap;font:12px/1.5 var(--mono);color:#cdd6e0}
</style>
</head>
<body>
<aside>
  <div class="brand"><h1>CODE<b>BREAKER</b></h1><p>Win95 reconstruction console</p></div>
  <nav id="nav"></nav>
  <div class="health"><span class="dot" id="dot"></span><span id="hstat">checking…</span></div>
</aside>
<main>
  <div class="head"><h2 id="ttl"></h2><p id="desc"></p></div>
  <div class="form" id="form"></div>
  <div class="status"><span id="badge"></span><span id="stat"></span></div>
  <div class="out" id="out">Select a tool.</div>
</main>
<script>
const TOOLS = [
 {id:"decompile", k:"C", ttl:"Decompile", accent:"module",
  desc:"Native x86 decompiler (NE 16-bit + PE 32-bit, auto-detected) — readable C, no Ghidra.",
  fields:[{n:"module",ph:"LZEXPAND / KERNEL32  or  full path.dll",w:1}],
  run:f=>({get:`/api/win95/decompile?module=${encodeURIComponent(f.module)}`})},
 {id:"disasm", k:"D", ttl:"Disassemble", accent:"module",
  desc:"Native disassembler (NE + PE) — per-segment/section listing with resolved call targets.",
  fields:[{n:"module",ph:"LZEXPAND / KERNEL32  or  full path",w:1}],
  run:f=>({get:`/api/win95/disasm?module=${encodeURIComponent(f.module)}`})},
 {id:"pe", k:"E", ttl:"EXE Explorer", pe:true,
  desc:"Full executable inspector for every Win95 format — PE, NE (Win16), LE (VxD), MZ (DOS): headers, sections/segments/objects, exports, imports, resources, hex.",
  fields:[{n:"module",ph:"KERNEL32 / LZEXPAND / act200l.vxd / XCOPY.EXE  or  path",w:1}]},
 {id:"triage", k:"T", ttl:"Origin Triage",
  desc:"Classify decompiled NE functions by origin (app vs CRT/compiler/asm/stub).",
  fields:[], run:_=>({argv:["--target","win95","origin_triage"]})},
 {id:"oracle", k:"O", ttl:"Oracle Equivalence",
  desc:"Run two NE modules on the Unicorn oracle and compare behavior export-by-export.",
  fields:[{n:"retail",ph:"retail .dll path",w:1},{n:"rebuilt",ph:"rebuilt .dll path",w:1},
          {n:"arity",ph:"arity (0)",w:0}],
  run:f=>({argv:["--target","win95","oracle_equiv",f.retail,f.rebuilt].concat(f.arity?["--arity",f.arity]:[])})},
 {id:"sweep", k:"N", ttl:"NE Sweep",
  desc:"Decompile every code-bearing NE (16-bit) module in the corpus → scoreboard.",
  fields:[{n:"limit",ph:"limit (blank = all)",w:0}],
  run:f=>({argv:["--target","win95","ne_scale"].concat(f.limit?["--limit",f.limit]:[]), timeout:1800})},
 {id:"pesweep", k:"P", ttl:"PE Sweep",
  desc:"Decompile every code-bearing PE (32-bit) module in the corpus → scoreboard.",
  fields:[{n:"limit",ph:"limit (blank = all)",w:0}],
  run:f=>({argv:["--target","win95","pe_scale"].concat(f.limit?["--limit",f.limit]:[]), timeout:3600})},
 {id:"lesweep", k:"V", ttl:"VxD Sweep",
  desc:"Decompile every LE (VxD / *.386 ring-0 driver) module in the corpus → scoreboard.",
  fields:[{n:"limit",ph:"limit (blank = all)",w:0}],
  run:f=>({argv:["--target","win95","le_scale"].concat(f.limit?["--limit",f.limit]:[]), timeout:3600})},
 {id:"mzsweep", k:"M", ttl:"DOS Sweep",
  desc:"Decompile every plain DOS/MZ 16-bit executable in the corpus → scoreboard.",
  fields:[{n:"limit",ph:"limit (blank = all)",w:0}],
  run:f=>({argv:["--target","win95","mz_scale"].concat(f.limit?["--limit",f.limit]:[]), timeout:1800})},
 {id:"console", k:">", ttl:"Command Console",
  desc:"Run any wt command. Every subsystem and target command is reachable here.",
  fields:[{n:"argv",ph:"--target win95 decompile LZEXPAND",w:1}],
  run:f=>({argv:f.argv.trim().split(/\s+/)})},
];
let cur=TOOLS[0];
const $=id=>document.getElementById(id);

function paintNav(){
  $("nav").innerHTML=TOOLS.map(t=>`<a data-id="${t.id}" class="${t.id==cur.id?'on':''}"><span class="k">${t.k}</span>${t.ttl}</a>`).join("");
  $("nav").querySelectorAll("a").forEach(a=>a.onclick=()=>select(a.dataset.id));
}
function select(id){
  cur=TOOLS.find(t=>t.id==id); paintNav();
  $("ttl").innerHTML=cur.ttl.replace(/^(\w)/,'<span>$1</span>');
  $("desc").textContent=cur.desc;
  $("form").innerHTML=cur.fields.map(f=>
    `<div class="field" style="flex:${f.w||0}">
       <label>${f.n}</label><input id="f_${f.n}" placeholder="${f.ph}"></div>`).join("")
    + `<button onclick="go()">Run ▸</button>`;
  $("badge").textContent=""; $("stat").textContent=""; $("out").textContent="ready.";
}
function fields(){const o={};cur.fields.forEach(f=>o[f.n]=($("f_"+f.n)||{}).value||"");return o;}
async function go(){
  if(cur.pe){ return goPE(fields().module); }
  const spec=cur.run(fields());
  $("out").textContent="running…"; $("badge").textContent=""; $("stat").textContent=spec.get||("wt "+(spec.argv||[]).join(" "));
  let j;
  try{
    if(spec.get){ j=await (await fetch(spec.get)).json(); }
    else{ j=await (await fetch("/api/run",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({argv:spec.argv,timeout:spec.timeout||900})})).json(); }
  }catch(e){ $("out").textContent="request failed: "+e; return; }
  const ok=j.exit===0;
  $("badge").className="badge "+(ok?"ok":"err"); $("badge").textContent="exit "+j.exit;
  const body=(j.stdout||"")+(j.stderr?("\n\n── stderr ──\n"+j.stderr):"");
  $("out").textContent=body||"(no output)";
}
// ---- PE Explorer (parity with PEExplorerV2's views) ----
let PE=null, PEMOD="";
const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function tbl(cols, rows){
  return `<table class="petbl"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead>`+
    `<tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
const kv=o=>`<table class="petbl">${Object.entries(o).map(([k,v])=>
  `<tr><th style="text-align:right">${k}</th><td>${esc(typeof v==="object"?JSON.stringify(v):v)}</td></tr>`).join("")}</table>`;
const TABSETS={
  PE:["summary","sections","directories","exports","imports","resources","hex"],
  NE:["summary","segments","exports","imports","resources","hex"],
  LE:["summary","objects","imports","hex"],
  MZ:["summary","relocations","hex"]};
async function goPE(m){
  if(!m){ $("out").textContent="enter a module (e.g. KERNEL32 / LZEXPAND / act200l.vxd)"; return; }
  PEMOD=m; $("out").innerHTML="parsing…"; $("stat").textContent="/api/exe/parse?module="+m; $("badge").textContent="";
  try{ PE=await (await fetch("/api/exe/parse?module="+encodeURIComponent(m))).json(); }
  catch(e){ $("out").textContent="request failed: "+e; return; }
  if(!PE.ok){ $("badge").className="badge err"; $("badge").textContent="error"; $("out").textContent=PE.error||"parse failed"; return; }
  $("badge").className="badge ok";
  $("badge").textContent=(PE.format||"?")+(PE.format=="PE"?(" "+PE.file_header.machine+(PE.pe_plus?"+":"")):PE.format=="NE"?" Win16":PE.format=="LE"?" VxD":"");
  peTab("summary");
}
function peTab(t){
  const fmt=PE.format||"PE"; const tabs=TABSETS[fmt]||TABSETS.PE;
  const nav=`<div class="petabs">${tabs.map(x=>`<span class="${x==t?'on':''}" onclick="peTab('${x}')">${x}</span>`).join("")}</div>`;
  let body="";
  if(t=="hex"){ peHex(0); return; }
  if(t=="summary"){
    if(fmt=="PE") body=`<h3>File header</h3>${kv(PE.file_header)}<h3>Optional header</h3>${kv(PE.optional_header)}`+
       `<h3>DOS header</h3>${kv(PE.dos)}`+(PE.rich?`<h3>Rich header</h3>${kv(PE.rich)}`:"")+
       (PE.clr?`<h3>.NET / CLR</h3>${kv(PE.clr)}`:"")+(PE.tls?`<h3>TLS</h3>${kv(PE.tls)}`:"")+
       (PE.certificates.length?`<h3>Certificates (${PE.certificates.length})</h3>`+tbl(["length","revision","type"],PE.certificates.map(c=>[c.length,c.revision,c.type])):"")+
       (PE.debug.length?`<h3>Debug</h3>`+tbl(["type","size","timestamp"],PE.debug.map(d=>[d.type,d.size,d.timestamp])):"")+
       `<h3>Base relocations</h3>${kv(PE.base_relocations)}`;
    else body=(PE.module_name?`<p><b>${esc(PE.module_name)}</b>${PE.description?" — "+esc(PE.description):""}</p>`:"")+`<h3>${fmt} header</h3>${kv(PE.header)}`;
  } else if(t=="sections"){
    body=tbl(["name","vaddr","vsize","raw off","raw size","flags"],PE.sections.map(s=>
      [esc(s.name),hex(s.vaddr),hex(s.vsize),hex(s.raw_offset),hex(s.raw_size),s.characteristics.join(" ")]));
  } else if(t=="segments"){
    body=tbl(["#","kind","file off","length","min alloc","flags"],PE.segments.map(s=>
      [s.index,s.kind,hex(s.file_offset),hex(s.length),hex(s.min_alloc),s.flags.join(" ")]));
  } else if(t=="objects"){
    body=tbl(["#","reloc base","vsize","pages","flags"],PE.objects.map(o=>
      [o.index,o.reloc_base,hex(o.vsize),o.page_count,o.flags.join(" ")]));
  } else if(t=="directories"){
    body=tbl(["#","directory","rva","size"],PE.data_directories.map((d,i)=>[i,d.name,hex(d.rva),d.size]));
  } else if(t=="relocations"){
    const r=PE.relocations;
    body=`<p>${r.count} relocations</p>`+tbl(["segment","offset","linear"],r.items.map(x=>[hex(x.segment),hex(x.offset),hex(x.linear)]));
  } else if(t=="exports"){
    const e=PE.exports;
    body=`<p>${esc(e.module||PE.module_name||"")} — ${e.count} exports</p>`+tbl(["ordinal","hint","name","rva","forward"],
      e.symbols.map(s=>[s.ordinal,s.hint==null||s.hint<0?"":s.hint,esc(s.undecorated||s.name||"(by ordinal)"),s.rva!=null?hex(s.rva):"",esc(s.forward||"")]));
  } else if(t=="imports"){
    if(fmt=="PE"){
      body=PE.imports.length? PE.imports.map(l=>`<h3>${esc(l.name)} (${l.count})</h3>`+
        tbl(["name","ordinal","hint"],l.symbols.map(s=>[esc(s.undecorated||s.name||"(by ordinal)"),s.ordinal<0?"":s.ordinal,s.hint<0?"":s.hint]))).join(""):"<p>no imports</p>";
      if(PE.delay_imports&&PE.delay_imports.length) body+="<h2>Delay imports</h2>"+PE.delay_imports.map(l=>`<h3>${esc(l.name)} (${l.count})</h3>`+
        tbl(["name","ordinal","hint"],l.symbols.map(s=>[esc(s.name||"(by ordinal)"),s.ordinal<0?"":s.ordinal,s.hint<0?"":s.hint]))).join("");
    } else body=PE.imports&&PE.imports.length? `<h3>imported modules</h3>`+tbl(["module"],PE.imports.map(l=>[esc(l.name)])):"<p>no imported modules</p>";
  } else if(t=="resources"){
    const r=PE.resources||{count:0,types:[]};
    body=`<p>${r.count} resources in ${r.types.length} types — click one to preview</p>`+r.types.map(ty=>
      `<h3>${esc(ty.type)} (${ty.count})</h3>`+(ty.items.length?tbl(["name/id","lang","kind","size",""],
        ty.items.map(it=>{
          const call=`resPreview(${it.foff},${it.size},${it.type_id},'${it.kind}','${esc(ty.type)} ${esc(it.name)}')`;
          return [`<a class="link" onclick="${call}">${esc(it.name)}</a>`,
                  it.lang==null?"":it.lang,it.kind,it.size,
                  `<button class="ghost" style="padding:1px 8px" onclick="${call}">view</button>`];
        })):"")).join("")+`<div id="respreview" class="respreview"></div>`;
  }
  $("out").innerHTML=nav+`<div class="pebody">${body}</div>`;
}
async function peHex(off){
  const tabs=TABSETS[(PE&&PE.format)||"PE"]||TABSETS.PE;
  const nav=`<div class="petabs">${tabs.map(x=>`<span class="${x=='hex'?'on':''}" onclick="peTab('${x}')">${x}</span>`).join("")}</div>`;
  const j=await (await fetch(`/api/pe/hex?module=${encodeURIComponent(PEMOD)}&off=${off}&len=1024`)).json();
  const ctl=`<div class="hexctl"><button class="ghost" onclick="peHex(${Math.max(0,off-1024)})">◀ prev</button>`+
    `<span>offset ${hex(off)}</span><button class="ghost" onclick="peHex(${off+1024})">next ▶</button></div>`;
  $("out").innerHTML=nav+ctl+`<pre class="hexdump">${esc(j.dump)}</pre>`;
}
const hex=n=>"0x"+((n>>>0).toString(16).toUpperCase());
async function resPreview(foff,size,type,kind,label){
  const pv=$("respreview"); if(!pv) return;
  const url=`/api/exe/resdata?module=${encodeURIComponent(PEMOD)}&foff=${foff}&size=${size}&type=${type}`;
  pv.innerHTML=`<div class="pvhdr">${esc(label)} — ${size} bytes</div><div class="pvbody">loading…</div>`;
  const bd=pv.querySelector('.pvbody');
  if(kind=="image"){
    bd.innerHTML=`<img class="pvimg" src="${url}" alt="${esc(label)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{textContent:'(image failed to render)'}))">`;
  } else {
    try{ const j=await (await fetch(url)).json(); bd.innerHTML=`<pre class="pvtext">${esc(j.text||"(empty)")}</pre>`; }
    catch(e){ bd.textContent="preview failed: "+e; }
  }
  pv.scrollIntoView({behavior:"smooth",block:"nearest"});
}
async function health(){
  try{ const j=await (await fetch("/api/health")).json();
    if(j.ok){ $("dot").className="dot up"; $("hstat").textContent="server up"; return; } }catch(e){}
  $("dot").className="dot"; $("hstat").textContent="offline";
}
paintNav(); select("decompile"); health(); setInterval(health,5000);
</script>
</body>
</html>
