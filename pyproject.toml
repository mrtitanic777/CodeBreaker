[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "codebreaker"
version = "1.0.0"
description = "CodeBreaker -- binaries reconstructed as readable source that behaves like the original"
requires-python = ">=3.10"
dependencies = ["textual>=0.80"]

[project.scripts]
codebreaker = "codebreaker.__main__:_entry"

[tool.setuptools.packages.find]
include = ["codebreaker*"]
