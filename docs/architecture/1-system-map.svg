<svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" role="img" style="color:#3a4654;background:#ffffff" aria-label="Layered system map: four entry points feed the drivers, which call verify/reconstruct.run; it asks the platform registry for a lane and runs five stages (decompile, build, judge, record, write), each backed by an engine, all on a shared foundation of base and formats."><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap");.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:14px}.toc a{color:#2747c4;text-decoration:none}.toc a:hover{text-decoration:underline}.bx{fill:#ffffff;stroke:#3a4654;stroke-width:1.2}.ax{fill:#e6ebfb;stroke:#2747c4;stroke-width:1.6}.dx{fill:#f2f4f6;stroke:#3a4654;stroke-width:1;stroke-dasharray:4 3}.sx{fill:#f2f4f6;stroke:#3a4654;stroke-width:1}.ln{stroke:currentColor;fill:none;stroke-width:1.4}.ln.d{stroke-dasharray:5 4}.t{fill:#141c26;font:600 13px "Instrument Sans",system-ui,sans-serif}.t.a{fill:#2747c4}.s{fill:#56626f;font:12px "Instrument Sans",system-ui,sans-serif}.sm{fill:#56626f;font:11.5px "JetBrains Mono",ui-monospace,Consolas,monospace}.lb{fill:#56626f;font:500 11px "JetBrains Mono",ui-monospace,Consolas,monospace}.layer{fill:#56626f;font:600 11px "JetBrains Mono",ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}.v-ok{fill:#17794a}.v-warn{fill:#946200}.v-bad{fill:#b4322b}.v-dim{fill:#5e6874}.b-ok{fill:#e3f3ea;stroke:#17794a}.b-bad{fill:#fbe6e4;stroke:#b4322b}.b-dim{fill:#eceef1;stroke:#5e6874}.b-warn{fill:#fbf1da;stroke:#946200}.tbl{overflow-x:auto;margin-top:18px;border:1px solid #c5ccd4;border-radius:6px;background:#ffffff}</style><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<!-- layer labels -->
<text class="layer" x="124" y="53" text-anchor="end">Ways in</text>
<text class="layer" x="124" y="159" text-anchor="end">Orchestration</text>
<text class="layer" x="124" y="288" text-anchor="end">Per module</text>
<text class="layer" x="124" y="440" text-anchor="end">Engines</text>
<text class="layer" x="124" y="553" text-anchor="end">Foundation</text>
<!-- row 1 -->
<rect class="bx" x="140" y="20" width="225" height="58" rx="4"/><text class="t" x="152" y="40">Command line</text><text class="sm" x="152" y="57">python -m codebreaker</text><text class="s" x="152" y="72">__main__.py · 66 commands</text>
<rect class="bx" x="385" y="20" width="225" height="58" rx="4"/><text class="t" x="397" y="40">Web console</text><text class="sm" x="397" y="57">ui/server.py</text><text class="s" x="397" y="72">serve · 127.0.0.1 only</text>
<rect class="bx" x="630" y="20" width="225" height="58" rx="4"/><text class="t" x="642" y="40">Desktop windows</text><text class="sm" x="642" y="57">ui/app · workbench · live</text><text class="s" x="642" y="72">the Win95-style Workbench</text>
<rect class="bx" x="875" y="20" width="225" height="58" rx="4"/><text class="t" x="887" y="40">MCP server</text><text class="sm" x="887" y="57">ui/mcp_server.py</text><text class="s" x="887" y="72">tools for an assistant</text>
<path class="ln" d="M252,78 V100 M497,78 V100 M742,78 V100 M987,78 V100 M252,100 H987"/>
<path class="ln" d="M290,100 V122" marker-end="url(#a1)"/>
<!-- row 2 -->
<rect class="bx" x="140" y="124" width="300" height="62" rx="4"/><text class="t" x="152" y="145">Drivers</text><text class="s" x="152" y="162">module · measure · sweep</text><text class="s" x="152" y="178">reach --judge · coverage · scoreboard</text>
<rect class="ax" x="470" y="124" width="300" height="62" rx="4"/><text class="t a" x="482" y="145">verify/reconstruct.run</text><text class="s" x="482" y="162">one path for every platform</text><text class="s" x="482" y="178">265 lines, no platform branches</text>
<rect class="bx" x="800" y="124" width="300" height="62" rx="4"/><text class="t" x="812" y="145">platforms/ · 13 descriptors</text><text class="s" x="812" y="162">identify(path) → its lane module</text><text class="sm" x="812" y="178">verify/&lt;kind&gt;.py: 4 functions</text>
<path class="ln" d="M440,155 H468" marker-end="url(#a1)"/><text class="lb" x="455" y="148" text-anchor="middle">run</text>
<path class="ln" d="M770,155 H798" marker-end="url(#a1)"/><text class="lb" x="785" y="148" text-anchor="middle">ask</text>
<!-- fan out to stages -->
<path class="ln" d="M620,186 V212 M220,212 H1020"/>
<path class="ln" d="M220,212 V234 M420,212 V234 M620,212 V234 M820,212 V234 M1020,212 V234" marker-end="url(#a1)"/>
<text class="lb" x="628" y="204">calls in order</text>
<!-- row 3 stages -->
<g>
<rect class="bx" x="140" y="236" width="160" height="96" rx="4"/><text class="t" x="152" y="257">1 · Decompile</text><text class="sm" x="152" y="276">describe.py</text><text class="sm" x="152" y="293">→ decompiler.exe</text><text class="sm" x="152" y="310">→ c_text.py</text>
<rect class="bx" x="340" y="236" width="160" height="96" rx="4"/><text class="t" x="352" y="257">2 · Build</text><text class="sm" x="352" y="276">build/functions</text><text class="s" x="352" y="293">each function compiled</text><text class="s" x="352" y="310">one module linked</text>
<rect class="bx" x="540" y="236" width="160" height="96" rx="4"/><text class="t" x="552" y="257">3 · Judge</text><text class="sm" x="552" y="276">&lt;kind&gt;.judge</text><text class="s" x="552" y="293">both run, same inputs</text><text class="s" x="552" y="310">jobs/pool workers</text>
<rect class="bx" x="740" y="236" width="160" height="96" rx="4"/><text class="t" x="752" y="257">4 · Record</text><text class="sm" x="752" y="276">store/functions</text><text class="s" x="752" y="293">functions.sqlite</text><text class="s" x="752" y="310">verdict per profile</text>
<rect class="bx" x="940" y="236" width="160" height="96" rx="4"/><text class="t" x="952" y="257">5 · Write</text><text class="sm" x="952" y="276">module_writer</text><text class="s" x="952" y="293">placement in the tree</text><text class="s" x="952" y="310">status per function</text>
</g>
<path class="ln" d="M300,284 H338" marker-end="url(#a1)"/><text class="lb" x="320" y="277" text-anchor="middle">C</text>
<path class="ln" d="M500,284 H538" marker-end="url(#a1)"/><text class="lb" x="520" y="277" text-anchor="middle">DLL</text>
<path class="ln" d="M700,284 H738" marker-end="url(#a1)"/><text class="lb" x="720" y="277" text-anchor="middle">result</text>
<path class="ln" d="M900,284 H938" marker-end="url(#a1)"/><text class="lb" x="920" y="277" text-anchor="middle">rows</text>
<!-- row 4 engines -->
<rect class="sx" x="140" y="388" width="160" height="96" rx="4"/><text class="t" x="152" y="409">Native decompiler</text><text class="s" x="152" y="428">forked Ghidra core</text><text class="s" x="152" y="445">SLEIGH: x86, PowerPC</text><text class="s" x="152" y="462">+ 6502 Z80 SM83 68k</text>
<rect class="sx" x="340" y="388" width="160" height="96" rx="4"/><text class="t" x="352" y="409">Toolchains</text><text class="s" x="352" y="428">OpenWatcom · NASM fork</text><text class="s" x="352" y="445">own Z80/SM83/68k asm</text><text class="s" x="352" y="462">period MSC (DOSBox-X)</text>
<rect class="sx" x="540" y="388" width="160" height="96" rx="4"/><text class="t" x="552" y="409">Emulators</text><text class="s" x="552" y="428">Unicorn: x86, PowerPC</text><text class="s" x="552" y="445">Win16 env · VxD ring 0</text><text class="s" x="552" y="462">own 6502 Z80 SM83 68k</text>
<rect class="sx" x="740" y="388" width="160" height="96" rx="4"/><text class="t" x="752" y="409">Names and facts</text><text class="s" x="752" y="428">symbols/: imports, CRT</text><text class="s" x="752" y="445">prototypes, demangle</text><text class="s" x="752" y="462">analyze/: structs, calls</text>
<rect class="sx" x="940" y="388" width="160" height="96" rx="4"/><text class="t" x="952" y="409">Outputs</text><text class="sm" x="952" y="428">Converted/&lt;bin&gt;/</text><text class="s" x="952" y="445">the Win95 source tree</text><text class="s" x="952" y="462">scoreboard · reports</text>
<path class="ln" d="M220,388 V334" marker-end="url(#a1)"/><text class="lb" x="227" y="366">C text</text>
