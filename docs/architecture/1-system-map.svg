<!-- row 5 foundation -->
<rect class="bx" x="140" y="520" width="470" height="58" rx="4"/><text class="t" x="152" y="540">base/</text><text class="s" x="200" y="540">settings · corpus · cache · parallel · converted</text><text class="s" x="152" y="565">results filed under a hash of their inputs (state/cache/)</text>
<rect class="bx" x="630" y="520" width="470" height="58" rx="4"/><text class="t" x="642" y="540">formats/</text><text class="s" x="710" y="540">96 readers: PE NE LE MZ XEX XBE · ROMs · CAB · ISO · STFS</text><text class="s" x="642" y="565">platforms recognise files, and stages read them, through these</text>
</svg>