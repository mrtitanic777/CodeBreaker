<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470">
<title>Xbox 360 — a whole title recompiled to C++</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1240" height="470" rx="14" fill="#0f1419"/>
<text x="32" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="700">Xbox 360 — a whole title recompiled to C++</text>
<text x="32" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">recompile-project &lt;package, ISO or folder&gt; --check: from a retail title to a PC program that runs.</text>
<rect x="32" y="110" width="177.66666666666666" height="100" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="120.83333333333333" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Unpack</text>
<text x="120.83333333333333" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">STFS · GoD · ISO</text>
<text x="120.83333333333333" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">FATX · folders</text>
<line x1="209.66666666666666" y1="160.0" x2="231.66666666666666" y2="160.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="231.66666666666666" y="110" width="177.66666666666666" height="100" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="320.5" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">XEX</text>
<text x="320.5" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">decrypt, decompress</text>
<text x="320.5" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">→ basic .xex (xex-basic)</text>
<line x1="409.3333333333333" y1="160.0" x2="431.3333333333333" y2="160.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="431.3333333333333" y="110" width="177.66666666666666" height="100" rx="9" fill="#2e2350" stroke="#bc8cff" stroke-width="1.4"/>
<text x="520.1666666666666" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Analyse</text>
<text x="520.1666666666666" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">imports, switch tables,</text>
<text x="520.1666666666666" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">functions (xenon-config)</text>
<line x1="609.0" y1="160.0" x2="631.0" y2="160.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="631.0" y="110" width="177.66666666666666" height="100" rx="9" fill="#2e2350" stroke="#bc8cff" stroke-width="1.4"/>
<text x="719.8333333333334" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">XenonRecomp</text>
<text x="719.8333333333334" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">PowerPC → C++</text>
<text x="719.8333333333334" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">per function</text>
<line x1="808.6666666666666" y1="160.0" x2="830.6666666666666" y2="160.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="830.6666666666666" y="110" width="177.66666666666666" height="100" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="919.5" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Build</text>
<text x="919.5" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">CMake project,</text>
<text x="919.5" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">4 compiles at a time</text>
<line x1="1008.3333333333333" y1="160.0" x2="1030.3333333333333" y2="160.0" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1030.3333333333333" y="110" width="177.66666666666666" height="100" rx="9" fill="#1b3d2a" stroke="#3fb950" stroke-width="1.4"/>
<text x="1119.1666666666665" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Run</text>
<text x="1119.1666666666665" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">x360 runtime:</text>
<text x="1119.1666666666665" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">kernel, GPU, audio, input</text>
<rect x="32" y="260" width="380" height="120" rx="9" fill="#21262d" stroke="#8b949e" stroke-width="1.4"/>
<text x="222.0" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Assets</text>
<text x="222.0" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">the title&#x27;s files unpacked into the project&#x27;s assets/</text>
<text x="222.0" y="321.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">content read in Xbox byte order</text>
<text x="222.0" y="339.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">Converted/&lt;title&gt;/</text>
<rect x="440" y="260" width="380" height="120" rx="9" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.4"/>
<text x="630.0" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Patches &amp; tools</text>
<text x="630.0" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">xex-edit: flags, nop / bytes / asm / hooks</text>
<text x="630.0" y="321.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">ppc-calls, xdk-match, classes (RTTI)</text>
<text x="630.0" y="339.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">crypto: XeCrypt, keyvaults, NAND</text>
<rect x="848" y="260" width="360" height="120" rx="9" fill="#1b3d2a" stroke="#3fb950" stroke-width="1.4"/>
<text x="1028.0" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">--check</text>
<text x="1028.0" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">builds it and runs it headless</text>
<text x="1028.0" y="321.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">frames presented, unimplemented</text>
<text x="1028.0" y="339.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">imports, the first stop</text>
<text x="32" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">Minecraft (Xbox 360 Edition) passes the slow regression tier: recompiled, built and run headless in about 3 minutes.</text>
</svg>
