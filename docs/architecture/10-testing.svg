<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 420" width="1240" height="420">
<title>How CodeBreaker is tested</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1240" height="420" rx="14" fill="#0f1419"/>
<text x="32" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="700">How CodeBreaker is tested</text>
<text x="32" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">tools\gate.cmd before every push; the milestone regression at every milestone.</text>
<rect x="32" y="110" width="230" height="100" rx="9" fill="#21262d" stroke="#8b949e" stroke-width="1.4"/>
<text x="147.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Build</text>
<text x="147.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">tools\build_codebreaker_exe.cmd</text>
<text x="147.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">incremental, ~15 s</text>
<rect x="310" y="110" width="270" height="100" rx="9" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.4"/>
<text x="445.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Unit tests</text>
<text x="445.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">cb_tests: 5,450 tests</text>
<text x="445.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">in 8 shards</text>
<rect x="310" y="230" width="270" height="100" rx="9" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.4"/>
<text x="445.0" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Command cases</text>
<text x="445.0" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">155 commands run as a user would,</text>
<text x="445.0" y="291.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">output compared with reviewed goldens</text>
<rect x="630" y="110" width="270" height="100" rx="9" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.4"/>
<text x="765.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Interface tests</text>
<text x="765.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">the terminal UI under a real</text>
<text x="765.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">Python, on a seeded store</text>
<rect x="630" y="230" width="270" height="100" rx="9" fill="#1b3d2a" stroke="#3fb950" stroke-width="1.4"/>
<text x="765.0" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Gate: PASS</text>
<text x="765.0" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">all three, one parallel run,</text>
<text x="765.0" y="291.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">4 at a time</text>
<line x1="262" y1="160" x2="310" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="262" y1="175" x2="310" y2="270" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="580" y1="160" x2="630" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="580" y1="280" x2="630" y2="280" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="765" y1="210" x2="765" y2="230" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="950" y="110" width="258" height="220" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="962" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Milestone regression</text>
<text x="962" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">codebreaker regress</text>
<text x="962" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal"></text>
<text x="962" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">all15   boot to Setup (2 runs)</text>
<text x="962" y="206.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">setup   the Setup chain</text>
<text x="962" y="224.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">install to the desktop</text>
<text x="962" y="241.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">slow    an Xbox 360 title</text>
<line x1="900" y1="280" x2="950" y2="280" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="32" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">Goldens change only after their diff is reviewed. The judge itself is tested: `teeth` breaks passed functions to prove it notices.</text>
</svg>
