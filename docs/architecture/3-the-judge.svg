<svg viewBox="0 0 1000 510" xmlns="http://www.w3.org/2000/svg" role="img" style="color:#3a4654;background:#ffffff" aria-label="The judge: the same inputs go to the original function and to the rebuilt one, each running in the emulator and producing a fingerprint; compare.first_difference turns the fingerprints into one of four verdicts; coverage from the original steers new inputs toward branches not yet taken."><style>@import url("https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap");.toc{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:14px}.toc a{color:#2747c4;text-decoration:none}.toc a:hover{text-decoration:underline}.bx{fill:#ffffff;stroke:#3a4654;stroke-width:1.2}.ax{fill:#e6ebfb;stroke:#2747c4;stroke-width:1.6}.dx{fill:#f2f4f6;stroke:#3a4654;stroke-width:1;stroke-dasharray:4 3}.sx{fill:#f2f4f6;stroke:#3a4654;stroke-width:1}.ln{stroke:currentColor;fill:none;stroke-width:1.4}.ln.d{stroke-dasharray:5 4}.t{fill:#141c26;font:600 13px "Instrument Sans",system-ui,sans-serif}.t.a{fill:#2747c4}.s{fill:#56626f;font:12px "Instrument Sans",system-ui,sans-serif}.sm{fill:#56626f;font:11.5px "JetBrains Mono",ui-monospace,Consolas,monospace}.lb{fill:#56626f;font:500 11px "JetBrains Mono",ui-monospace,Consolas,monospace}.layer{fill:#56626f;font:600 11px "JetBrains Mono",ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase}.v-ok{fill:#17794a}.v-warn{fill:#946200}.v-bad{fill:#b4322b}.v-dim{fill:#5e6874}.b-ok{fill:#e3f3ea;stroke:#17794a}.b-bad{fill:#fbe6e4;stroke:#b4322b}.b-dim{fill:#eceef1;stroke:#5e6874}.b-warn{fill:#fbf1da;stroke:#946200}.tbl{overflow-x:auto;margin-top:18px;border:1px solid #c5ccd4;border-radius:6px;background:#ffffff}</style><rect width="100%" height="100%" fill="#ffffff"/>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect class="bx" x="20" y="130" width="190" height="130" rx="4"/><text class="t" x="32" y="152">Inputs v</text><text class="s" x="32" y="174">4 fixed vectors</text><text class="s" x="32" y="192">+ confirming vectors</text><text class="s" x="32" y="210">+ directed and guided</text><text class="s" x="32" y="228">inputs, aimed at</text><text class="s" x="32" y="246">branches not yet taken</text>
<path class="ln" d="M210,175 H235 V88 H258" marker-end="url(#a3)"/>
<path class="ln" d="M210,215 H235 V328 H258" marker-end="url(#a3)"/>
<text class="lb" x="241" y="206">same v</text>
<rect class="bx" x="260" y="40" width="260" height="96" rx="4"/><text class="t" x="272" y="62">Original</text><text class="s" x="272" y="81">the binary, at its own address</text><text class="s" x="272" y="99">imports stubbed, unmapped pages</text><text class="s" x="272" y="117">mapped on first touch</text>
<rect class="bx" x="260" y="280" width="260" height="96" rx="4"/><text class="t" x="272" y="302">Rebuild</text><text class="s" x="272" y="321">the built DLL, at its entry</text><text class="s" x="272" y="339">same emulator, same input</text><text class="s" x="272" y="357">retried with more steps if cut short</text>
<path class="ln d" d="M390,40 V18 H115 V128" marker-end="url(#a3)"/><text class="lb" x="252" y="13" text-anchor="middle">coverage: which branches never ran</text>
<path class="ln" d="M520,88 H558" marker-end="url(#a3)"/>
<path class="ln" d="M520,328 H558" marker-end="url(#a3)"/>
<rect class="bx" x="560" y="63" width="180" height="50" rx="4"/><text class="t" x="650" y="93" text-anchor="middle">fingerprint A</text>
<rect class="bx" x="560" y="303" width="180" height="50" rx="4"/><text class="t" x="650" y="333" text-anchor="middle">fingerprint B</text>
<rect class="dx" x="560" y="140" width="180" height="136" rx="4"/><text class="lb" x="572" y="160">A FINGERPRINT HOLDS</text><text class="s" x="572" y="180">how it ended · return value</text><text class="s" x="572" y="198">calls + arguments, in order</text><text class="s" x="572" y="216">memory it wrote</text><text class="s" x="572" y="234">stack moved · saved regs</text><text class="s" x="572" y="252">instructions that ran</text>
<path class="ln" d="M740,88 H885 V148" marker-end="url(#a3)"/>
<path class="ln" d="M740,328 H885 V252" marker-end="url(#a3)"/>
<rect class="ax" x="790" y="150" width="190" height="100" rx="4"/><text class="t a" x="802" y="174">first_difference</text><text class="sm" x="802" y="194">verify/compare.py</text><text class="s" x="802" y="214">each input, A against B</text><text class="s" x="802" y="232">leftover return bits masked</text>
<path class="ln" d="M885,250 V400 M132,400 H885"/>
<path class="ln" d="M132,400 V422 M377,400 V422 M622,400 V422 M867,400 V422" marker-end="url(#a3)"/>
<rect class="b-ok" x="20" y="424" width="225" height="74" rx="4" stroke-width="1.4"/><text class="t v-ok" x="32" y="446">equivalent</text><text class="s" x="32" y="466">every input equal, and at</text><text class="s" x="32" y="484">least one run returned</text>
<rect class="b-warn" x="265" y="424" width="225" height="74" rx="4" stroke-width="1.4"/><text class="t v-warn" x="277" y="446">consistent</text><text class="s" x="277" y="466">every input equal, but no</text><text class="s" x="277" y="484">run returned normally</text>
<rect class="b-bad" x="510" y="424" width="225" height="74" rx="4" stroke-width="1.4"/><text class="t v-bad" x="522" y="446">divergent</text><text class="s" x="522" y="466">an input differed; the</text><text class="s" x="522" y="484">reason names which kind</text>
<rect class="b-dim" x="755" y="424" width="225" height="74" rx="4" stroke-width="1.4"/><text class="t v-dim" x="767" y="446">inconclusive</text><text class="s" x="767" y="466">the original could not be</text><text class="s" x="767" y="484">observed on any input</text>
</svg>