<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470">
<title>The judge — behaviour, not bytes</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1240" height="470" rx="14" fill="#0f1419"/>
<text x="32" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="700">The judge — behaviour, not bytes</text>
<text x="32" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">Each function runs twice under the same emulator, from the same state, with the same arguments.</text>
<rect x="40" y="104" width="300" height="120" rx="9" fill="#21262d" stroke="#8b949e" stroke-width="1.4"/>
<text x="190.0" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Original function</text>
<text x="190.0" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">from the shipped binary,</text>
<text x="190.0" y="165.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">its real imports stubbed</text>
<text x="190.0" y="183.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">and recorded</text>
<rect x="40" y="250" width="300" height="120" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="190.0" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Rebuilt function</text>
<text x="190.0" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">compiled from the</text>
<text x="190.0" y="311.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">reconstructed source,</text>
<text x="190.0" y="329.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">linked into a DLL</text>
<rect x="420" y="160" width="330" height="160" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="585.0" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Emulator</text>
<text x="585.0" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">Unicorn: Win32 · Win16 · VxD · DOS</text>
<text x="585.0" y="221.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">own interpreters: PowerPC, 6502,</text>
<text x="585.0" y="239.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">Z80, SM83, 68000</text>
<text x="585.0" y="256.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">the same seeded inputs and memory</text>
<line x1="340" y1="164" x2="420" y2="210" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="340" y1="310" x2="420" y2="270" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="830" y="104" width="370" height="266" rx="9" fill="#1b3d2a" stroke="#3fb950" stroke-width="1.4"/>
<text x="1015.0" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Compared, event by event</text>
<text x="1015.0" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">every call out: target and arguments</text>
<text x="1015.0" y="165.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">the return value and flags</text>
<text x="1015.0" y="183.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">memory written, byte for byte</text>
<text x="1015.0" y="200.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">the stack and callee-saved registers</text>
<text x="1015.0" y="218.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">faults, and where they happen</text>
<text x="1015.0" y="235.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal"></text>
<text x="1015.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">teeth: functions the judge passed</text>
<text x="1015.0" y="270.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">are broken on purpose — it must notice</text>
<line x1="750" y1="240" x2="830" y2="240" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<text x="32" y="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">Verdicts:  verified (behaves as the original, on inputs that covered it)  ·  weak (a match, with a limit)  ·  unverified (behaves otherwise)  ·  not-judged  ·  no-compile</text>
</svg>
