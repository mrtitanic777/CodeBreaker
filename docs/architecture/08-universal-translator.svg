<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 500" width="1240" height="500">
<title>The universal translator</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1240" height="500" rx="14" fill="#0f1419"/>
<text x="32" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="700">The universal translator</text>
<text x="32" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">Every source language goes into one typed form (L2); every target comes out of it. A pair is never written by hand.</text>
<rect x="24" y="92" width="300" height="330" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="38" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="700">FRONT ENDS</text>
<rect x="40" y="124" width="268" height="60" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="174.0" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Java</text>
<text x="174.0" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">bytecode and source (j2x)</text>
<rect x="40" y="196" width="268" height="60" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="174.0" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Python</text>
<text x="174.0" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">inferred types (frontends/python)</text>
<rect x="40" y="268" width="268" height="60" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="174.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">C#</text>
<text x="174.0" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">C# source (frontends/csharp)</text>
<rect x="40" y="340" width="268" height="60" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="174.0" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Machine code</text>
<text x="174.0" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">via the decompiler</text>
<rect x="400" y="180" width="300" height="170" rx="9" fill="#2e2350" stroke="#bc8cff" stroke-width="1.4"/>
<text x="550.0" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">L2</text>
<text x="550.0" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">typed IR: records, classes,</text>
<text x="550.0" y="241.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">closures, exceptions,</text>
<text x="550.0" y="259.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">generic types</text>
<text x="550.0" y="276.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">desugar · rewrite · passes</text>
<line x1="308" y1="154" x2="400" y2="265" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="308" y1="226" x2="400" y2="265" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="308" y1="298" x2="400" y2="265" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="308" y1="370" x2="400" y2="265" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="776" y="92" width="440" height="330" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
<text x="790" y="114" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="700">BACK ENDS</text>
<rect x="792" y="124" width="408" height="60" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="996.0" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">C</text>
<text x="996.0" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">c, c_java: plain C</text>
<line x1="700" y1="265" x2="792" y2="154" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="792" y="196" width="408" height="60" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="996.0" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">C++17</text>
<text x="996.0" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">cpp17 + py.hpp / jrt.hpp runtimes</text>
<line x1="700" y1="265" x2="792" y2="226" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="792" y="268" width="408" height="60" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="996.0" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">C++03</text>
<text x="996.0" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">cpp03 for older toolchains</text>
<line x1="700" y1="265" x2="792" y2="298" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="792" y="340" width="408" height="60" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="996.0" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Java · C#</text>
<text x="996.0" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">java, csharp: and back again</text>
<line x1="700" y1="265" x2="792" y2="370" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<text x="32" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">judge-c-java roundtrip: a Java program goes to C and back, and both runs must agree. The Java lane is judged beside the JVM.</text>
</svg>
