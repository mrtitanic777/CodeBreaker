<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 540" width="1240" height="540">
<title>Platforms and lanes</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1240" height="540" rx="14" fill="#0f1419"/>
<text x="32" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="700">Platforms — what each lane brings back, and how it is checked</text>
<text x="48" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="700">PLATFORM</text>
<text x="500" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="700">COMES BACK AS</text>
<text x="860" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="700">CHECKED BY</text>
<rect x="32" y="114" width="1176" height="48" rx="8" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1"/>
<text x="48" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">32-bit Windows, original Xbox</text>
<text x="500" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">C per function</text>
<text x="860" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">behaviour, beside the original</text>
<rect x="32" y="170" width="1176" height="48" rx="8" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1"/>
<text x="48" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">16-bit Windows (NE)</text>
<text x="500" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">C, or assembly where written in asm</text>
<text x="860" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">behaviour; Win95 boots and installs</text>
<rect x="32" y="226" width="1176" height="48" rx="8" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1"/>
<text x="48" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">VxD drivers, DOS programs</text>
<text x="500" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">assembly source (DDK macros, MASM)</text>
<text x="860" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">byte for byte, and behaviour</text>
<rect x="32" y="282" width="1176" height="48" rx="8" fill="#1b3d2a" stroke="#3fb950" stroke-width="1"/>
<text x="48" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">Xbox 360 (XEX, packages, discs)</text>
<text x="500" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">C per function; whole title → C++</text>
<text x="860" y="312" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">behaviour; recompiled titles play</text>
<rect x="32" y="338" width="1176" height="48" rx="8" fill="#2e2350" stroke="#bc8cff" stroke-width="1"/>
<text x="48" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">XNA games (.NET)</text>
<text x="500" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">C#, content, HLSL</text>
<text x="860" y="368" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">MonoGame project builds and runs</text>
<rect x="32" y="394" width="1176" height="48" rx="8" fill="#3d2f12" stroke="#d29922" stroke-width="1"/>
<text x="48" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">Java programs</text>
<text x="500" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">C++03</text>
<text x="860" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">behaviour beside the JVM</text>
<rect x="32" y="450" width="1176" height="48" rx="8" fill="#123a3a" stroke="#39c5cf" stroke-width="1"/>
<text x="48" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#e6edf3" text-anchor="start" font-weight="600">NES · SMS/GG · Game Boy · Genesis · Spectrum · MSX</text>
<text x="500" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">assembly source (ca65, WLA-DX, RGBDS, ...)</text>
<text x="860" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#c9d1d9" text-anchor="start" font-weight="normal">byte for byte, functions run</text>
<text x="32" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">Next in line (spec or reader present, lane not built): MIPS (PS1/N64/PS2), SuperH, ARM, Cell — see docs/PLATFORMS.md.</text>
</svg>
