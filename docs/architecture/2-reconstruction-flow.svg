<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" width="1240" height="560">
<title>How a binary becomes source</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/></marker></defs>
<rect width="1240" height="560" rx="14" fill="#0f1419"/>
<text x="32" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#e6edf3" text-anchor="start" font-weight="700">How a binary becomes source — and how CodeBreaker knows it is right</text>
<text x="32" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" text-anchor="start" font-weight="normal">Nothing is counted until it compiles and behaves like the original. Byte-identical output is a signal, never the goal.</text>
<rect x="32" y="110" width="190" height="100" rx="9" fill="#21262d" stroke="#8b949e" stroke-width="1.4"/>
<text x="127.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Any binary</text>
<text x="127.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">exe · dll · drv · vxd</text>
<text x="127.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">xex · rom · jar · iso</text>
<rect x="262" y="110" width="190" height="100" rx="9" fill="#123a3a" stroke="#39c5cf" stroke-width="1.4"/>
<text x="357.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Unpack &amp; identify</text>
<text x="357.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">containers opened</text>
<text x="357.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">CPU, OS, SDK, compiler</text>
<text x="357.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">CRT recognised, not rebuilt</text>
<rect x="492" y="110" width="190" height="100" rx="9" fill="#2e2350" stroke="#bc8cff" stroke-width="1.4"/>
<text x="587.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Decompile</text>
<text x="587.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">SLEIGH → p-code</text>
<text x="587.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">→ L2 typed IR</text>
<text x="587.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">types, structs, far ptrs</text>
<rect x="722" y="110" width="230" height="100" rx="9" fill="#2e2350" stroke="#bc8cff" stroke-width="1.4"/>
<text x="837.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Source, as authored</text>
<text x="837.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">C where it was compiled</text>
<text x="837.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">assembly (MASM / NASM / cMacros)</text>
<text x="837.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">where it was written by hand</text>
<rect x="992" y="110" width="216" height="100" rx="9" fill="#3d2f12" stroke="#d29922" stroke-width="1.4"/>
<text x="1100.0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Build</text>
<text x="1100.0" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">OpenWatcom C + MASM</text>
<text x="1100.0" y="171.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">period compilers as checks</text>
<text x="1100.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">per function or whole</text>
<line x1="222" y1="160" x2="262" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="452" y1="160" x2="492" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="682" y1="160" x2="722" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="952" y1="160" x2="992" y2="160" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="992" y="270" width="216" height="110" rx="9" fill="#1b3d2a" stroke="#3fb950" stroke-width="1.4"/>
<text x="1100.0" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Judge</text>
<text x="1100.0" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">original and rebuild run</text>
<text x="1100.0" y="331.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">side by side in an emulator</text>
<text x="1100.0" y="349.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">on the same inputs</text>
<line x1="1100" y1="210" x2="1100" y2="270" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="722" y="270" width="230" height="110" rx="9" fill="#1b3d2a" stroke="#3fb950" stroke-width="1.4"/>
<text x="837.0" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Compare</text>
<text x="837.0" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">calls and arguments</text>
<text x="837.0" y="331.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">return value, memory left,</text>
<text x="837.0" y="349.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">stack and registers</text>
<line x1="992" y1="325" x2="952" y2="325" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="462" y="270" width="220" height="110" rx="9" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.4"/>
<text x="572.0" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Verdict</text>
<text x="572.0" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">verified · weak · unverified</text>
<text x="572.0" y="331.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">not-judged · no-compile</text>
<line x1="722" y1="325" x2="682" y2="325" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="32" y="270" width="390" height="110" rx="9" fill="#1f3a5f" stroke="#58a6ff" stroke-width="1.4"/>
<text x="227.0" y="294" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle" font-weight="600">Source tree &amp; store</text>
<text x="227.0" y="314" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">each function&#x27;s C or asm, its verdict,</text>
<text x="227.0" y="331.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">its name (propagated corpus-wide)</text>
<text x="227.0" y="349.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">— browsed in the UI, served over MCP</text>
<line x1="462" y1="325" x2="422" y2="325" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 572 380 C 572 470, 820 470, 820 380" fill="none" stroke="#8b949e" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="696" y="478" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="middle" font-weight="normal">repair / invert / exact: move a body toward the authored source, then judge it again</text>
<text x="32" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#8b949e" text-anchor="start" font-weight="normal">A module boots or runs only after every function in it is source: the Windows 95 lane proves whole modules by booting Setup and installing to the desktop.</text>
</svg>
